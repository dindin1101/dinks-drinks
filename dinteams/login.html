<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Login — Dinks &amp; Drinks Pickleball Zone</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="login-page">

<main class="login-shell">
  <div class="login-box">
    <img src="../assets/img/logo.png" alt="Dinks &amp; Drinks logo" width="92" height="92">
    <h1>Dinks <em>&amp;</em> Drinks</h1>
    <p class="login-sub">Pickleball Zone · Team Login</p>

    <!-- Real login (Supabase) -->
    <div id="loginView" hidden>
      <p class="hint">Sign in with your approved team Google account. Other accounts cannot access the dashboard.</p>
      <p id="loginError" class="form-error" role="alert" hidden></p>
      <button type="button" class="btn btn-lime btn-block btn-lg" id="loginBtn">Continue with Google</button>
      <p class="hint center" style="margin-top:14px">No separate website password or SMS code needed.</p>
    </div>

    <!-- Demo PIN (only while Supabase is not connected) -->
    <form id="pinView" hidden>
      <p class="hint">🧪 <strong>Demo mode</strong> — Supabase is not connected yet. Demo PIN is <strong>1234</strong>.</p>
      <div class="field">
        <label for="adminPin">Admin PIN</label>
        <input type="password" id="adminPin" inputmode="numeric" placeholder="••••" autocomplete="one-time-code">
      </div>
      <p id="pinError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-lime btn-block btn-lg" id="pinBtn">Enter Dashboard</button>
    </form>

    <p class="login-back"><a href="../index.html">← Back to booking page</a></p>
  </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-login.js"></script>
</body>
</html>
